server:
  port: 8080
spring:
  application:
    name: smart-energy-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/smartenergy
    username: postgres
    password: "system"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
app:
  jwt:
    secret: "MaSuperCleSecretePourSmartEnergyQuiEstTresLongueEtSecurisee2026"
    expiration-ms: 86400000
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@smartenergy.tn}
  admin:
    email: ${ADMIN_EMAIL:admin@smartenergy.tn}
    password: ${ADMIN_PASSWORD:Admin@12345}
